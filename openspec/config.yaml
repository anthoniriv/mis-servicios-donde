rules:
  proposal:
    - State the user problem, MVP boundaries, rollout assumptions, and rollback strategy for risky changes.
    - Distinguish validated requirements from unresolved product or architecture decisions.
  specs:
    - Use RFC 2119 keywords for normative requirements.
    - Express acceptance scenarios in Given/When/Then form.
    - Specify privacy, abuse prevention, temporal windows, idempotency, and concurrency behavior explicitly.
  design:
    - Include Mermaid context, container, data-flow, and sequence diagrams when they clarify system behavior.
    - Record architecture decisions with rationale and rejected alternatives.
    - Treat raw latitude/longitude as ephemeral sensitive input that must never be persisted or logged.
  tasks:
    - Group work by delivery phase and use hierarchical numbering.
    - Keep each task independently verifiable and completable in one focused session.
  apply:
    guidelines:
      - Follow the approved specs and design; do not invent unresolved product behavior during implementation.
      - Add test tooling and update this configuration before application implementation begins.
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive or privacy-impacting deltas into the main specifications.
