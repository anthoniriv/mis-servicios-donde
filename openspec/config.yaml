schema: spec-driven

context: |
  Project stage: planning-only workspace; no application source or dependency manifests exist yet.
  Intended frontend: Astro static site with interactive map and report-form islands.
  Intended backend: NestJS API with Prisma and Neon PostgreSQL.
  Intended geospatial/UI stack: H3 (h3-js) and deck.gl H3HexagonLayer.
  Intended architecture: report ingestion, anti-abuse, consensus aggregation, and outbound alerts.
  Source brief: alertas-cortes-lima.md (Spanish); generated technical artifacts default to English.
  Repository status: Git has not been initialized.

