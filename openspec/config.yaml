schema: spec-driven

context: |
  Project stage: executable npm-workspace foundation on Node.js 22.
  Frontend: Astro 7 static site; interactive map and report-form islands remain planned.
  Backend: NestJS 11 API; Prisma and Neon PostgreSQL remain planned.
  Shared contracts: TypeScript package with Zod schemas.
  Intended geospatial/UI stack: H3 (h3-js) and deck.gl H3HexagonLayer.
  Intended architecture: report ingestion, anti-abuse, consensus aggregation, and outbound alerts.
  Source brief: alertas-cortes-lima.md (Spanish); generated technical artifacts default to English.
  Repository status: Git initialized on main; implementation uses stacked-to-main work units.

strict_tdd: true

testing:
  detected: "2026-08-30"
  status: available
  reason: Unit, PostgreSQL integration, E2E, lint, type-check, build, and CI commands were executed successfully in Work Unit 1.
  runner:
    framework: Vitest
    command: npm run test:unit
  layers:
    unit:
      available: true
      tool: Vitest
    integration:
      available: true
      tool: Vitest + Supertest + PostgreSQL 17 fixture
    e2e:
      available: true
      tool: Playwright
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: true
      command: npm run lint
    type_checker:
      available: true
      command: npm run typecheck
    formatter:
      available: false
      command: ""

rules:
  proposal:
    - State the user problem, MVP boundaries, rollout assumptions, and rollback strategy for risky changes.
    - Distinguish validated requirements from unresolved product or architecture decisions.
  specs:
    - Use RFC 2119 keywords for normative requirements.
    - Express acceptance scenarios in Given/When/Then form.
    - Specify privacy, abuse prevention, temporal windows, idempotency, and concurrency behavior explicitly.
  design:
    - Include Mermaid context, container, data-flow, and sequence diagrams when they clarify system behavior.
    - Record architecture decisions with rationale and rejected alternatives.
    - Treat raw latitude/longitude as ephemeral sensitive input that must never be persisted or logged.
  tasks:
    - Group work by delivery phase and use hierarchical numbering.
    - Keep each task independently verifiable and completable in one focused session.
  apply:
    guidelines:
      - Follow the approved specs and design; do not invent unresolved product behavior during implementation.
      - Add test tooling and update this configuration before application implementation begins.
    tdd: true
    test_command: npm run test:unit
  verify:
    test_command: npm run check && npm run test:integration && npm run test:e2e
    build_command: npm run build
    coverage_threshold: 0
  archive:
    - Warn before merging destructive or privacy-impacting deltas into the main specifications.
